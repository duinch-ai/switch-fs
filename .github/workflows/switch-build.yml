name: Nintendo Switch Build CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-nx:
    name: Build Switch NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Switch Dependencies
        run: |
          dkp-pacman --noconfirm -S --needed switch-curl switch-mbedtls switch-libarchive switch-pkg-config || true
          git config --system --add safe.directory $GITHUB_WORKSPACE
      - name: Build NRO
        run: |
          python3 scripts/patch_borealis.py
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_SWITCH=ON \
            -DVERSION_BUILD=${{ github.run_number }}
          cmake --build build --target SwitchFS.nro -j$(nproc)
      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchFS-Switch-${{ github.run_number }}
          path: build/SwitchFS.nro
